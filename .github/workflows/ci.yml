name: Mac checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mac-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: impl-swift checks
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 检查格式、lint 与 SwiftPM 测试
        run: bash scripts/check.sh
